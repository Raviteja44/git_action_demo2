name: "2. Promote to UAT"

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA from DEV to promote to UAT'
        required: true
        type: string
      deployment_reason:
        description: 'Reason for promoting to UAT'
        required: true
        type: string

# Set explicit permissions for Git operations and PR creation
permissions:
  contents: write        # Required to create branches and fetch commits
  pull-requests: write   # Required to create PRs

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate commit exists and is in DEV
        id: validate-commit
        run: |
          COMMIT_SHA="${{ github.event.inputs.commit_sha }}"
          echo "Validating commit: $COMMIT_SHA"

          # Fetch DEV branch
          git fetch origin dev

          # Verify commit exists
          if ! git cat-file -e $COMMIT_SHA^{commit} 2>/dev/null; then
            echo "❌ Error: Commit $COMMIT_SHA does not exist in repo"
            exit 1
          fi

          # Verify commit is in DEV branch
          if ! git merge-base --is-ancestor $COMMIT_SHA origin/dev 2>/dev/null; then
            echo "❌ Error: Commit $COMMIT_SHA is not in DEV branch"
            exit 1
          fi

          echo "✅ Commit validated and exists in DEV"
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV

      - name: Determine feature branch (optional)
        id: determine-branch
        run: |
          # Attempt to find feature branch from commit
          FEATURE_BRANCH=$(git branch -r --contains $COMMIT_SHA | grep -v "dev" | head -n1 | sed 's|origin/||')
          if [ -z "$FEATURE_BRANCH" ]; then
            FEATURE_BRANCH="unknown"
          fi
          echo "FEATURE_BRANCH=$FEATURE_BRANCH" >> $GITHUB_ENV
          echo "Feature branch determined: $FEATURE_BRANCH"

      - name: Create UAT branch
        id: create-uat-branch
        run: |
          UAT_BRANCH="uat-${FEATURE_BRANCH//\//-}-$(date +%s)"
          git fetch origin uat
          git checkout -b $UAT_BRANCH origin/uat
          echo "UAT_BRANCH=$UAT_BRANCH" >> $GITHUB_ENV
          echo "✅ Created UAT branch: $UAT_BRANCH"

      - name: Merge commit into UAT branch
        run: |
          git merge --no-ff $COMMIT_SHA -m "Promote commit $COMMIT_SHA from DEV to UAT"
          echo "✅ Merged commit $COMMIT_SHA into $UAT_BRANCH"

      - name: Push UAT branch
        run: |
          git push origin $UAT_BRANCH
          echo "✅ Pushed UAT branch to remote: $UAT_BRANCH"

      - name: Create UAT PR
        uses: actions/github-script@v7
        with:
          script: |
            const uatBranch = process.env.UAT_BRANCH;
            const commitSha = process.env.COMMIT_SHA;
            const deploymentReason = '${{ github.event.inputs.deployment_reason }}';

            const prBody = `
            ## Promotion to UAT Environment
            **Commit SHA:** ${commitSha}
            **UAT Branch:** ${uatBranch}
            **Promotion Reason:** ${deploymentReason}

            **Verification:**
            - Deployed to DEV
            - Tested in DEV Environment

            **Approval Required:** Manager/Team Lead approval required.
            `;

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `UAT: Promote commit ${commitSha}`,
              head: uatBranch,
              base: 'uat',
              body: prBody
            });

            console.log(`✅ Created UAT PR: ${pr.html_url}`);

            // Add label for tracking
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['uat-promotion']
            });
