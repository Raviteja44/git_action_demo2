name: "Promote from Dev to UAT"

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA from DEV branch to promote'
        required: true
        type: string
      feature_branch:
        description: 'Feature branch name (optional, for labeling/logs)'
        required: false
        type: string
      deployment_reason:
        description: 'Reason for promoting to UAT'
        required: true
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Validate commit exists in DEV
        id: validate-commit
        run: |
          COMMIT_SHA="${{ github.event.inputs.commit_sha }}"
          FEATURE_BRANCH="${{ github.event.inputs.feature_branch }}"

          echo "Validating commit $COMMIT_SHA exists in DEV branch..."
          
          git fetch origin dev
          if ! git cat-file -e "$COMMIT_SHA^{commit}" 2>/dev/null; then
            echo "❌ Error: Commit $COMMIT_SHA does not exist in repo"
            exit 1
          fi
          
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/dev 2>/dev/null; then
            echo "❌ Error: Commit $COMMIT_SHA is not in dev branch"
            exit 1
          fi

          echo "✅ Commit exists in DEV branch"
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "feature_branch=$FEATURE_BRANCH" >> $GITHUB_OUTPUT

      - name: Create UAT branch and PR
        uses: actions/github-script@v7
        with:
          script: |
            const commitSha = '${{ steps.validate-commit.outputs.commit_sha }}';
            let featureBranch = '${{ steps.validate-commit.outputs.feature_branch }}';
            const deploymentReason = '${{ github.event.inputs.deployment_reason }}';
            
            if (!featureBranch || featureBranch === '') {
              featureBranch = commitSha.substring(0,7); // fallback for labeling
            }

            // Create unique UAT branch
            const uatBranch = `uat-${featureBranch.replace(/\//g,'-')}-${Date.now()}`;

            // Get current UAT branch SHA
            const { data: uatRef } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'uat'
            });

            // Create UAT branch from latest UAT
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/heads/${uatBranch}`,
              sha: uatRef.commit.sha
            });

            // Merge the commit from DEV into UAT branch
            await github.rest.repos.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: uatBranch,
              head: commitSha
            });

            // Create UAT PR
            const prBody = `
            ## Promotion to UAT
            **Commit SHA:** ${commitSha}
            **Feature Branch:** ${featureBranch}
            **Promotion Reason:** ${deploymentReason}

            **Verification:**
            - Deployed to DEV
            - Tested in DEV Environment

            **Approval Required:** Manager/Team Lead approval.
            `;

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `UAT: Promote ${featureBranch}`,
              body: prBody,
              head: uatBranch,
              base: 'uat'
            });

            // Add label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['uat-promotion']
            });

            console.log(`✅ UAT PR created: ${pr.html_url}`);
